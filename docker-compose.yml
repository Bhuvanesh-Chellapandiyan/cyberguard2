version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: cyberguard_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cyberguard_net

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=phishing_detector
      - JWT_SECRET=production-cyberguard-secret-key-32-chars-minimum
      - JWT_EXPIRE_MINUTES=120
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - cyberguard_net

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberguard_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cyberguard_net

networks:
  cyberguard_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
